name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          version: '0.12.13'
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --locked --dev
      - name: Lint and type check
        run: uv run --locked task lint
      - name: Test
        run: uv run --locked pytest --cov=augly_jp --cov=tests --cov-report=term-missing:skip-covered --cov-report=xml tests
      - name: Upload coverage
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
