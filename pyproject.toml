[project]
name = "augly-jp"
version = "2021.9.30"
description = "Data Augmentation for Japanese Text"
authors = [{ name = "chck", email = "shimekiri.today@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "augly>=1.0.0,<2",
    "chikkarpy>=0.1.1",
    "dartsclone==0.9.0",
    "fugashi[unidic-lite]>=1.5.2",
    "gensim>=4.4.0",
    "ginza>=5.2.1,<5.3",
    "ja-ginza-electra>=5.2.0",
    "nlpaug>=1.1.11,<1.2",
    "numpy>=2.4.6",
    "python-levenshtein>=0.27.5",
    "python-magic-bin==0.4.14 ; sys_platform == 'win32' or (sys_platform == 'darwin' and platform_machine == 'x86_64')",
    "python-magic-standalone==0.4.28 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece>=0.2.2",
    "setuptools>=80.10.2,<81",
    "spacy>=3.8.16,<4",
    "tenacity>=9.1.4",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=4.25.1,<4.26",
]

[project.urls]
Repository = "https://github.com/chck/AugLy-jp"

[dependency-groups]
dev = [
    "absl-py>=2.5.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "pandas>=3.0.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
    "scikit-learn>=1.9.1",
    "taskipy>=1.14.1",
    "tensorboard>=2.21.0",
    "ty>=0.0.80",
]

[tool.taskipy.tasks]
lint = { cmd = "ruff check augly_jp && ruff format --check augly_jp && ty check augly_jp", help = "execute linter" }
fmt = { cmd = "ruff check --fix augly_jp && ruff format augly_jp", help = "format code" }
test = { cmd = "task fmt && pytest -s", help = "run all test" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = """
-rxvv \
--cov-report term-missing:skip-covered \
--cov augly_jp \
--cov tests \
-n auto"""

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "augly_jp"
module-root = ""

[tool.uv]
build-constraint-dependencies = ["setuptools<81"]

[tool.uv.extra-build-dependencies]
chikkarpy = ["setuptools<81"]
